    <text x="104" y="58" text-anchor="start" class="box-sub">clf, reg, cluster</text>
  </g>

  <g transform="translate(500,570)">
    <rect class="box" x="0" y="0" width="110" height="86" rx="2" />
    <path class="icon" d="M 30 25 H 80 V 64 H 30 Z" />
    <path class="icon" d="M 38 34 H 72 M 38 44 H 72 M 38 54 H 60" />
    <text x="55" y="106" text-anchor="middle" class="small">models/</text>
  </g>

