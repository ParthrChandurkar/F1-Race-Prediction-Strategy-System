<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">F1 Race Prediction and Strategy System Architecture</title>
  <desc id="desc">Architecture diagram showing data ingestion, model training, prediction runtime, MLOps, and delivery flow.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111" />
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .group { fill: #ffffff; stroke: #2f80ed; stroke-width: 2; stroke-dasharray: 8 7; }
      .group-title { font: 700 22px Arial, sans-serif; fill: #111111; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #111111; }
      .box-sub { font: 15px Arial, sans-serif; fill: #111111; }
      .small { font: 14px Arial, sans-serif; fill: #111111; }
      .arrow { stroke: #111111; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .arrow-thin { stroke: #111111; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .label { font: 15px Arial, sans-serif; fill: #111111; }
      .icon { fill: #ffffff; stroke: #111111; stroke-width: 2; }
      .icon-fill { fill: #111111; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1600" height="900" />

  <text x="800" y="48" text-anchor="middle" class="group-title">F1 Race Prediction and Strategy System Architecture</text>

  <!-- Region boundaries -->
  <rect class="group" x="70" y="95" width="540" height="630" rx="4" />
  <text x="95" y="128" class="group-title">Training Pipeline</text>

  <rect class="group" x="650" y="95" width="600" height="630" rx="4" />
  <text x="675" y="128" class="group-title">Application Runtime</text>

  <rect class="group" x="1290" y="95" width="240" height="630" rx="4" />
  <text x="1315" y="128" class="group-title">MLOps</text>

  <!-- Users -->
  <g transform="translate(680,790)">
    <circle class="icon" cx="0" cy="-24" r="18" />
    <path class="icon" d="M -36 34 C -28 4 28 4 36 34 Z" />
    <text x="70" y="-8" class="box-title">User / Race Analyst</text>
    <text x="70" y="20" class="box-sub">interacts with Streamlit UI</text>
  </g>

  <!-- Training pipeline boxes -->
  <g transform="translate(105,165)">
    <rect class="box" x="0" y="0" width="220" height="86" rx="2" />
    <path class="icon" d="M 24 20 H 58 L 70 32 V 66 H 24 Z" />
    <path class="icon" d="M 58 20 V 32 H 70" />
    <text x="96" y="36" text-anchor="start" class="box-title">Raw CSVs</text>
    <text x="96" y="62" text-anchor="start" class="box-sub">data/raw</text>
  </g>

  <g transform="translate(365,165)">
    <rect class="box" x="0" y="0" width="220" height="86" rx="2" />
    <circle class="icon" cx="48" cy="43" r="22" />
    <path class="icon" d="M 32 43 H 64 M 48 27 V 59" />
    <text x="96" y="36" text-anchor="start" class="box-title">Ingestion</text>
    <text x="96" y="62" text-anchor="start" class="box-sub">data_loader.py</text>
  </g>

  <g transform="translate(235,300)">
    <rect class="box" x="0" y="0" width="240" height="86" rx="2" />
    <path class="icon" d="M 30 23 H 66 M 30 43 H 66 M 30 63 H 66" />
