    <text x="104" y="62" text-anchor="start" class="box-sub">rolling form, targets</text>
  </g>

  <g transform="translate(235,570)">
    <rect class="box" x="0" y="0" width="240" height="86" rx="2" />
    <circle class="icon" cx="48" cy="43" r="23" />
    <path class="icon" d="M 48 20 V 43 L 65 56" />
