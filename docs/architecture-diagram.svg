    <text x="104" y="64" text-anchor="start" class="box-sub">prediction, simulation, strategy</text>
  </g>

  <!-- MLOps boxes -->
  <g transform="translate(1320,165)">
    <rect class="box" x="0" y="0" width="180" height="76" rx="2" />
    <text x="90" y="32" text-anchor="middle" class="box-title">Params</text>
    <text x="90" y="58" text-anchor="middle" class="box-sub">params.yaml</text>
  </g>

  <g transform="translate(1320,285)">
    <rect class="box" x="0" y="0" width="180" height="76" rx="2" />
    <text x="90" y="32" text-anchor="middle" class="box-title">DVC Pipeline</text>
    <text x="90" y="58" text-anchor="middle" class="box-sub">dvc.yaml</text>
  </g>

  <g transform="translate(1320,425)">
    <rect class="box" x="0" y="0" width="180" height="76" rx="2" />
    <text x="90" y="32" text-anchor="middle" class="box-title">Metrics</text>
    <text x="90" y="58" text-anchor="middle" class="box-sub">evaluation JSON</text>
  </g>

  <g transform="translate(1320,545)">
    <rect class="box" x="0" y="0" width="180" height="76" rx="2" />
    <text x="90" y="32" text-anchor="middle" class="box-title">Registry</text>
    <text x="90" y="58" text-anchor="middle" class="box-sub">mlops/registry</text>
  </g>

  <g transform="translate(125,785)">
    <rect class="box" x="0" y="0" width="200" height="76" rx="2" />
    <text x="100" y="32" text-anchor="middle" class="box-title">GitHub Actions</text>
    <text x="100" y="58" text-anchor="middle" class="box-sub">tests and validation</text>
  </g>

  <g transform="translate(375,785)">
    <rect class="box" x="0" y="0" width="210" height="76" rx="2" />
    <text x="105" y="32" text-anchor="middle" class="box-title">Docker</text>
    <text x="105" y="58" text-anchor="middle" class="box-sub">Dockerfile, compose</text>
  </g>

