  <g transform="translate(690,165)">
    <rect class="box" x="0" y="0" width="250" height="86" rx="2" />
    <path class="icon" d="M 28 62 V 34 L 50 20 L 72 34 V 62 Z" />
    <path class="icon" d="M 38 62 V 44 H 62 V 62" />
    <text x="100" y="32" text-anchor="start" class="box-title">2025 Context</text>
    <text x="100" y="58" text-anchor="start" class="box-sub">grid, teams, circuits</text>
  </g>

  <g transform="translate(970,165)">
    <rect class="box" x="0" y="0" width="250" height="86" rx="2" />
    <circle class="icon" cx="46" cy="43" r="24" />
    <path class="icon" d="M 30 43 H 62 M 46 27 V 59" />
    <text x="100" y="32" text-anchor="start" class="box-title">Prediction</text>
    <text x="100" y="58" text-anchor="start" class="box-sub">predictor.py</text>
  </g>

  <g transform="translate(755,340)">
    <rect class="box" x="0" y="0" width="240" height="86" rx="2" />
    <rect class="icon" x="24" y="24" width="48" height="38" />
    <path class="icon" d="M 32 52 L 44 39 L 54 47 L 66 32" />
    <text x="100" y="32" text-anchor="start" class="box-title">Simulation</text>
    <text x="100" y="58" text-anchor="start" class="box-sub">Monte Carlo</text>
  </g>

  <g transform="translate(1030,340)">
    <rect class="box" x="0" y="0" width="190" height="86" rx="2" />
    <path class="icon" d="M 28 27 H 62 V 39 H 28 Z M 28 49 H 62 V 61 H 28 Z" />
    <text x="92" y="32" text-anchor="start" class="box-title">Strategy</text>
    <text x="92" y="58" text-anchor="start" class="box-sub">pit + tyres</text>
  </g>

  <g transform="translate(850,555)">
